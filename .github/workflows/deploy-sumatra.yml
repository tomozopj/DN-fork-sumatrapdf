name: Build and Release SumatraPDF (DN-fork)

on:
  workflow_dispatch:
  push:
    branches: [ "dn_3.5.2_patch2" ]

permissions:
  contents: write # リリース作成と削除の両方に必要です

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build SumatraPDF
      run: |
        msbuild vs2022/SumatraPDF.sln `
          -target:SumatraPDF `
          -property:Configuration=Release `
          -property:Platform=x64 `
          -maxCpuCount

    - name: Create Release Tag
      id: tag
      shell: pwsh
      run: |
        $date = Get-Date -Format "yyyyMMdd-HHmm"
        echo "tag_name=v3.5.2-dn-$date" >> $env:GITHUB_OUTPUT

    - name: Automatic Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag_name }}
        name: SumatraPDF DN-fork Release ${{ steps.tag.outputs.tag_name }}
        draft: false
        prerelease: false
        files: out/rel64/SumatraPDF.exe
        body: |
          SumatraPDF DN-fork (3.5.2_patch2) の自動ビルド版バイナリです。

          ## 📌 今回の更新内容
          - **ソース元:** [dnobori/DN-fork-sumatrapdf](https://github.com/dnobori/DN-fork-sumatrapdf) の最新ソースをビルド
          - **パッチ:** 登大遊 氏によるアクセラレータキー（ショートカット）の最適化パッチ適用済

          ## 💻 ビルド環境
          - **ツール:** GitHub Actions (MSVC v143 / x64 Release)

          ## 💾 使い方
          1. 下記の **Assets** セクションから `SumatraPDF.exe` を直接ダウンロード。
          2. インストール不要のポータブル版としてそのまま使用可能です。

          ---
          > [!IMPORTANT]
          > **免責事項:** これは非公式の自動ビルドです。不具合等を元の作者様へ問い合わせることはご遠慮ください。

    # ここから自動削除ステップ
    - name: Delete older releases
      uses: dev-drprasad/delete-older-releases@v0.3.3
      with:
        keep_latest: 3 # 最新の3件だけを残して古いものを削除
        delete_tags: true # 削除したリリースに関連するタグも完全に消去
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

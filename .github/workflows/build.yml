name: Build and Release SumatraPDF (DN-fork)

on:
  workflow_dispatch: # 手動実行用
  push:
    branches: [ "dn_3.5.2_patch2" ]

permissions:
  contents: write # リリースを作成するために必要な権限

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build SumatraPDF
      run: |
        msbuild vs2022/SumatraPDF.sln `
          -target:SumatraPDF `
          -property:Configuration=Release `
          -property:Platform=x64 `
          -maxCpuCount

    - name: Create Release Tag
      id: tag
      shell: pwsh
      run: |
        $date = Get-Date -Format "yyyyMMdd-HHmm"
        echo "tag_name=v3.5.2-dn-$date" >> $env:GITHUB_OUTPUT

    - name: Automatic Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag_name }}
        name: SumatraPDF DN-fork Release ${{ steps.tag.outputs.tag_name }}
        files: out/rel64/SumatraPDF.exe
        draft: false
        prerelease: false

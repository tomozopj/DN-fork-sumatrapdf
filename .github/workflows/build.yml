name: Build SumatraPDF (DN-fork)

on:
  workflow_dispatch:
  push:
    branches: [ "dn_3.5.2_patch2" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build SumatraPDF
      # 壊れている補助ツール(enginedump)を無視して、本体(SumatraPDF)だけをビルドします
      run: |
        msbuild vs2022/SumatraPDF.sln `
          -target:SumatraPDF `
          -property:Configuration=Release `
          -property:Platform=x64 `
          -maxCpuCount

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SumatraPDF-DN-fork-exe
        path: |
          out/rel64/SumatraPDF.exe

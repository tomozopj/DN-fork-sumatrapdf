name: Build SumatraPDF (DN-fork)

on:
  workflow_dispatch: # 手動でビルドを開始するための設定
  push:
    branches: [ "dn_3.5.2_patch2" ]

jobs:
  build:
    runs-on: windows-latest # 2026年最新のWindowsランナーを使用

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive # 依存ライブラリ（ext）を読み込むために必須

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build Solution
      run: |
        msbuild SumatraPDF.sln `
          -property:Configuration=Release `
          -property:Platform=x64 `
          -maxCpuCount

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SumatraPDF-DN-fork-exe
        path: |
          out/Release/SumatraPDF.exe
          out/Release/*.dll

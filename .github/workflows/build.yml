name: Build and Release SumatraPDF (DN-fork)

on:
  workflow_dispatch:
  push:
    branches: [ "dn_3.5.2_patch2" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build SumatraPDF
      run: |
        msbuild vs2022/SumatraPDF.sln `
          -target:SumatraPDF `
          -property:Configuration=Release `
          -property:Platform=x64 `
          -maxCpuCount

    - name: Create Release Tag
      id: tag
      shell: pwsh
      run: |
        $date = Get-Date -Format "yyyyMMdd-HHmm"
        echo "tag_name=v3.5.2-dn-$date" >> $env:GITHUB_OUTPUT

    - name: Automatic Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag_name }}
        name: SumatraPDF DN-fork Release ${{ steps.tag.outputs.tag_name }}
        draft: false
        prerelease: false
        files: out/rel64/SumatraPDF.exe
        body: |
          SumatraPDF DN-fork (3.5.2_patch2) の自動ビルド版バイナリです。

          ## 📌 今回の更新内容
          - **ソース元:** [dnobori/DN-fork-sumatrapdf](https://github.com/dnobori/DN-fork-sumatrapdf) の `dn_3.5.2_patch2` ブランチを反映
          - **主な変更:** 登大遊 氏によるアクセラレータキーの挙動修正・最適化パッチ適用済

          ## 💻 ビルド環境
          - **コンパイラ:** MSVC v143 (Visual Studio 2022)
          - **ターゲット:** Windows x64 (64-bit)
          - **ツール:** GitHub Actions (windows-latest)

          ## 💾 使い方
          1. 下記の **Assets** から `SumatraPDF.exe` をダウンロード。
          2. そのまま実行してポータブル版として利用可能です。

          ---
          > [!IMPORTANT]
          > **免責事項:** これは非公式のビルドです。不具合報告を元の作者様へ送らないようお願いします。

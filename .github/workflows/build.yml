name: Build SumatraPDF (DN-fork)

on:
  workflow_dispatch:
  push:
    branches: [ "dn_3.5.2_patch2" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Find and Build Solution
      shell: pwsh
      run: |
        # 1. リポジトリ内のすべての .sln ファイルを探して表示する（デバッグ用）
        $slnFiles = Get-ChildItem -Recurse -Filter *.sln
        Write-Host "Found the following solution files:"
        $slnFiles.FullName

        # 2. 最初の .sln ファイルを取得
        $targetSln = $slnFiles[0].FullName
        if (-not $targetSln) { throw "Solution file not found!" }
        Write-Host "Building: $targetSln"

        # 3. ビルド実行
        msbuild $targetSln `
          -property:Configuration=Release `
          -property:Platform=x64 `
          -maxCpuCount
          
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SumatraPDF-DN-fork-exe
        path: |
          **/Release/SumatraPDF.exe
          **/Release/*.dll
